<style>
  :root{--bg:#08061A;--soft:#0D0A20;--surf:#141031;--line:rgba(255,255,255,.14);--text:#FFFFFF;--muted:rgba(255,255,255,.66);
    --violet:#CF84F7;--violetd:#8B3FD4;--blue:#2D5AD6;--yellow:#FCEE21;
    --grad:linear-gradient(100deg,#CF84F7 0%,#7B4FE0 48%,#2D5AD6 100%);
    --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
  .glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 600px at 80% -10%,rgba(207,132,247,.20),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(45,90,214,.18),transparent 60%)}
  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:22px 20px 36px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .logo{height:26px;margin:6px auto 0;display:block;opacity:.96}
  .prog{display:flex;align-items:center;gap:10px;justify-content:center;margin:18px 0 4px;color:var(--muted);font-weight:600;font-size:.92rem}
  .prog .bars{display:flex;gap:6px}
  .prog .b{width:26px;height:6px;border-radius:999px;background:var(--line);transition:background .3s}
  .prog .b.on{background:var(--violet)}
  .card{background:linear-gradient(180deg,var(--soft),rgba(13,10,32,.6));border:1px solid var(--line);border-radius:24px;padding:28px 22px;margin-top:20px;box-shadow:0 20px 60px rgba(0,0,0,.45);flex:1;display:flex;flex-direction:column;justify-content:center;animation:rise .4s both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .topic{color:var(--blue);background:linear-gradient(90deg,var(--violet),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
  .q{font-size:clamp(1.35rem,5.2vw,1.85rem);font-weight:700;line-height:1.24;margin:0}
  .ex{color:var(--muted);font-size:.96rem;margin-top:12px;line-height:1.5}
  .inp{width:100%;margin-top:20px;background:var(--surf);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:16px;font-size:1.15rem;font-family:inherit}
  .inp:focus{border-color:var(--violet);outline:none}
  .cnt{text-align:right;color:var(--muted);font-size:.85rem;margin-top:6px}
  .cnt.warn{color:var(--yellow)}
  .welcome{font-size:1.08rem;color:var(--muted);margin-top:8px;line-height:1.55}
  .actions{margin-top:24px;display:flex;gap:10px}
  .btn{appearance:none;border:0;cursor:pointer;background:var(--grad);color:#fff;font-weight:700;padding:17px 26px;border-radius:999px;font-size:1.08rem;transition:filter .2s,transform .1s;box-shadow:0 10px 28px rgba(123,79,224,.35)}
  .btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;filter:none}
  .btn.block{width:100%}.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--text);box-shadow:none}
  .center{text-align:center}
  .h{font-family:var(--font);font-weight:800;font-size:clamp(1.7rem,8vw,2.3rem);margin:0}
  .allocate{display:flex;flex-direction:column;gap:22px;margin-top:22px}
  .alrow .al-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .alrow .al-name{font-weight:700;font-size:1.02rem}
  .alrow .al-val{font-family:var(--font);font-weight:800;font-size:1.3rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;background:var(--surf);outline:none;accent-color:var(--violetd)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--violetd);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--violetd);cursor:pointer}
  .totalline{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-top:16px;border-top:1px solid var(--line);font-size:.92rem;color:var(--muted);font-weight:600}
  .totalline b{color:var(--text);font-family:var(--font)}
  .polarity{margin-top:22px}
  .pz-refs{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--muted);font-size:.84rem}
  .pz-val{text-align:center;margin-top:18px}
  .pz-val .n{font-family:var(--font);font-weight:800;font-size:clamp(2.6rem,14vw,3.6rem);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .pz-val .l{color:var(--muted);font-size:.9rem;font-weight:600;margin-top:2px}
  .result{margin-top:18px}
  .result .big{text-align:center}
  .result .big .n{font-family:var(--font);font-weight:800;font-size:clamp(3.4rem,20vw,5rem);line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .result .big .l{color:var(--muted);font-weight:600;margin-top:4px}
  .rbar{height:16px;border-radius:999px;overflow:hidden;display:flex;margin-top:18px;background:var(--surf);border:1px solid var(--line)}
  .rbar .pos{background:var(--grad)}
  .rbar .neg{background:rgba(252,238,33,.35)}
  .rlegend{display:flex;justify-content:space-between;margin-top:8px;font-size:.82rem;color:var(--muted);font-weight:600}
  .breakdown{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .brow{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .brow .bt{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  .brow .bb{height:8px;border-radius:999px;overflow:hidden;display:flex;background:var(--bg)}
  .brow .bb .pos{background:var(--grad)}
  .brow .bb .neg{background:rgba(252,238,33,.4)}
  .check{width:84px;height:84px;margin:0 auto 20px;border-radius:50%;background:rgba(123,79,224,.18);display:grid;place-items:center}
  .status{margin-top:16px;color:var(--muted);min-height:1.4em}
  .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(45,90,214,.16);color:#A7C0F7;border:1px solid rgba(45,90,214,.5);padding:8px 16px;border-radius:999px;font-weight:600;margin-top:14px}
  .hide{display:none!important}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>

    sref=db.collection("sessions").doc(SESSION);aref=sref.collection("answers");
    window.firebase.auth().onAuthStateChanged(function(u){
      if(u){sref.onSnapshot(function(d){var m=d.exists?d.data():DEFAULT_META;metaSubs.forEach(function(cb){cb(m);});});}
    });
    window.firebase.auth().signInAnonymously().catch(function(e){console.warn("Auth anónima falló:",e);mode="demo";initDemo();});
  }
  function initDemo(){try{ch=new BroadcastChannel("imeb-"+SESSION);ch.onmessage=function(e){if(e.data==="m")dEmitMeta();};}catch(e){}window.addEventListener("storage",function(e){if(e.key===mk)dEmitMeta();});metaSubs.forEach(function(cb){cb(dReadMeta());});}
  if(useFB()){try{initFB();mode="firebase";}catch(e){mode="demo";}}
  if(mode==="demo")initDemo();
  return {
    mode:function(){return mode;},
    onMeta:function(cb){metaSubs.push(cb);if(mode==="demo")cb(dReadMeta());},
    start:function(id,test){if(mode==="firebase"){return aref.doc(id).set({id:id,status:"started",test:!!test,startedAt:Date.now()},{merge:true});}var a=dReadAns();if(!a[id]){a[id]={id:id,status:"started",test:!!test,startedAt:Date.now()};dWriteAns(a);try{ch&&ch.postMessage("a");}catch(e){}}},
    submit:function(id,data){if(mode==="firebase"){return aref.doc(id).set(Object.assign({},data,{id:id,status:"completed",completedAt:Date.now()}),{merge:true});}var a=dReadAns();a[id]=Object.assign({},a[id],data,{id:id,status:"completed",completedAt:Date.now()});dWriteAns(a);try{ch&&ch.postMessage("a");}catch(e){}return Promise.resolve();}
  };
})();

/* --- Identidad de dispositivo --- */
function deviceId(){var id=null;try{id=localStorage.getItem("imeb_device");}catch(e){}if(!id){id="d-"+Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem("imeb_device",id);}catch(e){}}return id;}
var DID=deviceId(), DONE="imeb_done_"+SESSION, PEND="imeb_pend_"+SESSION;
function isDone(){try{return localStorage.getItem(DONE)==="1";}catch(e){return false;}}

var card=document.getElementById("card"),prog=document.getElementById("prog"),plabel=document.getElementById("plabel");
var meta=null, step=-1, name="";
var weights={pasado:34,presente:33,futuro:33};
var pos={pasado:50,presente:50,futuro:50};

Store.onMeta(function(m){meta=m;if(step===-1&&!isDone())renderWelcome();});

function setProg(n){if(n<0||n>3){prog.classList.add("hide");return;}prog.classList.remove("hide");plabel.textContent=(n+1)+" de 4";var bs=prog.querySelectorAll(".b");bs.forEach(function(b,i){b.classList.toggle("on",i<=n);});}

function renderWelcome(){
  setProg(-1);
  if(isDone())return renderAlready();
  if(meta&&meta.isOpen===false)return renderClosed();
  card.className="card center";
  card.innerHTML='<h1 class="h">'+TXT.welcomeTitle+'</h1><p class="welcome">'+TXT.welcome+'</p>'+
    '<input class="inp" id="nameInp" type="text" autocomplete="name" maxlength="60" placeholder="'+TXT.namePh+'">'+
    '<p class="status" id="nameErr"></p>'+
    '<div class="actions"><button class="btn block" id="start" disabled>'+TXT.start+'</button></div>';
  var inp=document.getElementById("nameInp"),btn=document.getElementById("start");
  inp.oninput=function(){btn.disabled=inp.value.trim().length<3;};
  inp.onkeydown=function(e){if(e.key==="Enter"&&!btn.disabled)btn.click();};
  btn.onclick=function(){
    var v=inp.value.trim().replace(/\s+/g," ");
    if(v.length<3){document.getElementById("nameErr").textContent=TXT.nameErr;return;}
    if(meta&&meta.isOpen===false)return renderClosed();
    name=v.slice(0,60);
    Store.start(DID,meta&&meta.testMode);
    step=0;renderStep();
  };
  setTimeout(function(){inp.focus();},80);
}
function renderClosed(){setProg(-1);card.className="card center";card.innerHTML='<h1 class="h">'+TXT.closedTitle+'</h1><p class="welcome">'+TXT.closed+'</p>';}
function renderAlready(){setProg(-1);card.className="card center";card.innerHTML='<div class="check">'+chk()+'</div><h1 class="h">'+TXT.alreadyTitle+'</h1><p class="welcome">'+TXT.already+'</p>';}

function renderStep(){
  setProg(step);
  if(step===0)return renderAllocate();
  if(step>=1&&step<=3)return renderPolarity(HORIZONS[step-1]);
  submit();
}

function renderAllocate(){
  card.className="card";
  var rows=HORIZONS.map(function(h){return '<div class="alrow"><div class="al-top"><span class="al-name">'+h.label+'</span><span class="al-val" id="val-'+h.key+'">'+weights[h.key]+'%</span></div><input type="range" min="0" max="100" value="'+weights[h.key]+'" id="sl-'+h.key+'"></div>';}).join("");
  card.innerHTML='<div class="topic">'+ALLOC_TOPIC+'</div><h2 class="q">'+ALLOC_TITLE+'</h2>'+
    '<div class="allocate">'+rows+'</div>'+
    '<div class="totalline">Total<b id="totalval">100%</b></div>'+
    '<p class="ex">'+ALLOC_EX+'</p>'+
    '<div class="actions">'+(step>0?'<button class="btn sec" id="back">Atrás</button>':'')+'<button class="btn block" id="next">'+TXT.next+'</button></div>';
  HORIZONS.forEach(function(h){
    document.getElementById("sl-"+h.key).oninput=function(e){
      setWeight(h.key,parseInt(e.target.value,10));
      HORIZONS.forEach(function(k){document.getElementById("sl-"+k.key).value=weights[k.key];document.getElementById("val-"+k.key).textContent=weights[k.key]+"%";});
    };
  });
  if(step>0)document.getElementById("back").onclick=function(){step--;renderStep();};
  document.getElementById("next").onclick=function(){step++;advance();};
}
function setWeight(changedKey,newVal){
  newVal=Math.max(0,Math.min(100,newVal));
  var keys=["pasado","presente","futuro"],others=keys.filter(function(k){return k!==changedKey;});
  var remaining=100-newVal,oldA=weights[others[0]],oldB=weights[others[1]],oldSum=oldA+oldB,newA,newB;
  if(oldSum<=0){newA=Math.round(remaining/2);newB=remaining-newA;}
  else{newA=Math.round(remaining*oldA/oldSum);newB=remaining-newA;}
  weights[changedKey]=newVal;weights[others[0]]=newA;weights[others[1]]=newB;
}

function renderPolarity(h){
  card.className="card";var cur=pos[h.key];
  card.innerHTML='<div class="topic">'+h.topic+'</div><h2 class="q">'+h.title+'</h2><p class="ex">'+h.ex+'</p>'+
    '<div class="polarity"><input type="range" min="0" max="100" value="'+cur+'" id="pz"></div>'+
    '<div class="pz-val"><div class="n" id="pzn">'+cur+'%</div><div class="l">positiva</div></div>'+
    '<div class="pz-refs"><span>'+h.minLabel+'</span><span style="text-align:right">'+h.maxLabel+'</span></div>'+
    '<div class="actions"><button class="btn sec" id="back">Atrás</button><button class="btn block" id="next">'+TXT.next+'</button></div>';
  var sl=document.getElementById("pz"),n=document.getElementById("pzn");
  sl.oninput=function(e){cur=parseInt(e.target.value,10);pos[h.key]=cur;n.textContent=cur+"%";};
  document.getElementById("back").onclick=function(){step--;renderStep();};
  document.getElementById("next").onclick=function(){step++;advance();};
}
function advance(){if(step<4)return renderStep();submit();}

function computeResult(){
  var positivoTotal=0;
  HORIZONS.forEach(function(h){positivoTotal+=(weights[h.key]/100)*pos[h.key];});
  positivoTotal=Math.round(positivoTotal);
  return{positivoTotal:positivoTotal,negativoTotal:100-positivoTotal};
}

function submit(){
  setProg(-1);
  var r=computeResult();
  card.className="card";
  var rows=HORIZONS.map(function(h){return '<div class="brow"><div class="bt"><span>'+h.label+' · '+weights[h.key]+'% de tu cabeza</span><span>'+pos[h.key]+'% / '+(100-pos[h.key])+'%</span></div><div class="bb"><div class="pos" style="width:'+pos[h.key]+'%"></div><div class="neg" style="width:'+(100-pos[h.key])+'%"></div></div></div>';}).join("");
  card.innerHTML='<div class="topic">'+name+'</div><h2 class="q" style="font-size:1.1rem">'+TXT.thanksTitle+'</h2>'+
    '<div class="result"><div class="big"><div class="n">'+r.positivoTotal+'%</div><div class="l">de energía positiva</div></div>'+
    '<div class="rbar"><div class="pos" style="width:'+r.positivoTotal+'%"></div><div class="neg" style="width:'+r.negativoTotal+'%"></div></div>'+
    '<div class="rlegend"><span>Positiva '+r.positivoTotal+'%</span><span>Negativa '+r.negativoTotal+'%</span></div></div>'+
    '<div class="breakdown">'+rows+'</div>'+
    '<p class="status" id="st" style="margin-top:18px;text-align:center">'+TXT.saving+'</p>';
  var st=document.getElementById("st");
  var payload={name:name,pasado:weights.pasado,presente:weights.presente,futuro:weights.futuro,
    posPasado:pos.pasado,posPresente:pos.presente,posFuturo:pos.futuro,
    positivoTotal:r.positivoTotal,negativoTotal:r.negativoTotal,
    test:!!(meta&&meta.testMode)};
  try{localStorage.setItem(PEND,JSON.stringify(payload));}catch(e){}
  var settled=false;var slow=setTimeout(function(){if(!settled)st.textContent=TXT.retry;},1800);
  function ok(){settled=true;clearTimeout(slow);try{localStorage.setItem(DONE,"1");localStorage.removeItem(PEND);}catch(e){}st.innerHTML='<span class="badge">'+chkm()+' '+TXT.sent+'</span>';}
  var req=Store.submit(DID,payload);
  if(req&&req.then)req.then(ok).catch(ok);else ok();
}
function retryPending(){var p=null;try{p=JSON.parse(localStorage.getItem(PEND));}catch(e){}if(p&&!isDone()){var r=Store.submit(DID,p);if(r&&r.then)r.then(function(){try{localStorage.setItem(DONE,"1");localStorage.removeItem(PEND);}catch(e){}});}}

function chk(){return '<svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#2D5AD6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';}
function chkm(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';}

retryPending();
if(isDone())renderAlready();else renderWelcome();
})();
</script>
</body>
</html>
